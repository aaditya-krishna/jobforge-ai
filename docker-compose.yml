services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # Local development credentials only; must match DATABASE_URL in .env
      POSTGRES_USER: jobforge
      POSTGRES_PASSWORD: jobforge
      POSTGRES_DB: jobforge
    ports:
      # Bound to localhost so the database isn't reachable from your network.
      # Host port 5433 because a native PostgreSQL install already uses 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobforge -d jobforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
